name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOARDSHELF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]] && TAG="$GITHUB_REF_NAME"
          if [ -n "$TAG" ]; then V="${TAG#v}"; else V="0.0.0-dev.${{ github.run_number }}"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          BOARDSHELF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOARDSHELF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOARDSHELF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug \
            -PappVersionName="$APP_VERSION" -PappVersionCode=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Boardshelf-$APP_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Boardshelf-$APP_VERSION-debug.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: boardshelf-apk
          path: dist/*.apk

      - name: Attach APK to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --title "Boardshelf $APP_VERSION" --notes "Boardshelf $APP_VERSION"
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "dist/Boardshelf-$APP_VERSION.apk" --clobber
