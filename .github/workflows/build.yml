name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare own signing key (optional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOARDSHELF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # A release is made automatically when VERSION has no release yet (pushes to main only).
          if [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          BOARDSHELF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOARDSHELF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOARDSHELF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug \
            -PappVersionName="${{ steps.v.outputs.name }}" -PappVersionCode=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Boardshelf-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Boardshelf-${{ steps.v.outputs.name }}-debug.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: boardshelf-${{ steps.v.outputs.name }}
          path: dist/*.apk

      - name: Release notes
        if: steps.v.outputs.release == 'true'
        run: |
          NOTES="docs/release-notes/v${{ steps.v.outputs.name }}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/notes.md; else echo "Boardshelf ${{ steps.v.outputs.name }}" > dist/notes.md; fi

      - name: Release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Boardshelf ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          files: |
            dist/Boardshelf-${{ steps.v.outputs.name }}.apk
            docs/screenshots/de_*.png
