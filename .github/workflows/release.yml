name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Version $VERSION gibt es schon – bitte eine höhere Versionsnummer eintragen."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BOARDSHELF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          BOARDSHELF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOARDSHELF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOARDSHELF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappVersionName="$VERSION" -PappVersionCode=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Boardshelf-$VERSION.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/v$VERSION.md"
          [ -f "$NOTES" ] || { echo "Boardshelf $VERSION" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "v$VERSION" "dist/Boardshelf-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Boardshelf $VERSION" --notes-file "$NOTES"
