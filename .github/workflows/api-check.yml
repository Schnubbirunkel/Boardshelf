name: API check

on:
  workflow_dispatch:
    inputs:
      ean:
        description: "EAN to look up"
        default: "4002051682682"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query product sources
        run: |
          E="${{ inputs.ean }}"
          echo "== UPCitemdb lookup"; curl -s -A "Boardshelf/1.3" "https://api.upcitemdb.com/prod/trial/lookup?upc=$E" | head -c 2000; echo
          echo "== UPCitemdb search"; curl -s -A "Boardshelf/1.3" "https://api.upcitemdb.com/prod/trial/search?s=Catan&match_mode=0&type=product" | head -c 1500; echo
          echo "== Open Products Facts"; curl -s -A "Boardshelf/1.3" "https://world.openproductsfacts.org/api/v2/product/$E.json?fields=product_name,brands,image_front_url" | head -c 800; echo
          echo "== Open Food Facts"; curl -s -A "Boardshelf/1.3" "https://world.openfoodfacts.org/api/v2/product/$E.json?fields=product_name,brands,image_front_url" | head -c 800; echo
          echo "== Wikidata GTIN"; curl -s -A "Boardshelf/1.3" "https://www.wikidata.org/w/api.php?action=query&format=json&list=search&srsearch=haswbstatement:P3962=$E" | head -c 800; echo
          echo "== opengtindb"; curl -s "http://opengtindb.org/?ean=$E&cmd=query&queryid=400000000" | iconv -f ISO-8859-1 -t UTF-8 | head -c 800; echo
          echo "== GameUPC test"; curl -s -H "x-api-key: test_test_test_test_test" "https://api.gameupc.com/test/upc/$E" | head -c 1500; echo
          echo "== GameUPC test catan us"; curl -s -H "x-api-key: test_test_test_test_test" "https://api.gameupc.com/test/upc/029877030118" | head -c 800; echo
          echo "== Wikidata P2339=13"; curl -s -A "Boardshelf/1.3 (github.com/Schnubbirunkel/Boardshelf)" "https://www.wikidata.org/w/api.php?action=query&format=json&list=search&srlimit=3&srsearch=haswbstatement:P2339=13" | head -c 600; echo
          echo "== Wikidata P2339=180263 (7 Wonders Duel?)"; curl -s -A "Boardshelf/1.3 (github.com/Schnubbirunkel/Boardshelf)" "https://www.wikidata.org/w/api.php?action=query&format=json&list=search&srlimit=3&srsearch=haswbstatement:P2339=173346" | head -c 400; echo
          echo "== geekdo xmlapi2 no token"; curl -s -o /dev/null -w "%{http_code}\n" "https://api.geekdo.com/xmlapi2/thing?id=13"; curl -s "https://api.geekdo.com/xmlapi2/thing?id=13" | head -c 300; echo
          echo "== bgg xmlapi2 no token"; curl -s -o /dev/null -w "%{http_code}\n" "https://boardgamegeek.com/xmlapi2/thing?id=13"
          echo "== Wikidata Catan GTIN count"; curl -s -A "Boardshelf/1.3" "https://www.wikidata.org/w/api.php?action=query&format=json&list=search&srsearch=haswbstatement:P3962&srlimit=1" | head -c 400; echo
